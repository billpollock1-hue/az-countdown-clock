<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>BB Returns - Silhouette Progress</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      min-height: 100dvh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding-top: max(2rem, env(safe-area-inset-top));
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      padding: 9px 14px 12px 14px;
      max-width: 100%;
    }

    .title {
      color: white;
      font-size: 38px;
      font-weight: bold;
      text-align: center;
      margin-top: 8px;
    }

    .silhouette-wrapper {
      position: relative;
      width: 175px;
      height: 380px;
      margin-left: 20px;
      border: 3px solid white;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .photo-full {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    /* Clipping window that grows from the bottom to reveal the outline */
    .outline-reveal {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      overflow: hidden;
      z-index: 2;
      transition: height 0.1s linear;
    }

    /* Fixed full-size outline image; only the part inside .outline-reveal shows */
    .outline-image {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 175px;
      height: 380px;
      background-size: cover;
      background-position: center;
    }

    .progress-info {
      color: #7fff00;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .progress-percent {
      font-size: 48px;
      color: #7fff00;
      margin-top: 10px;
    }

    .arrival-date {
      color: rgba(255, 255, 255, 0.8);
      font-size: 16px;
      margin-top: 20px;
    }

    .view-toggle-link {
      display: block;
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      margin-top: 20px;
      width: 175px;
      box-sizing: border-box;
    }

    .silhouette-stage {
      position: relative;
      width: 271px;
    }

    .annotation {
      position: absolute;
      left: 175px;
      margin-left: 10px;
      top: 0%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      z-index: 5;
      transition: top 0.1s linear;
      pointer-events: none;
    }

    .annotation-arrow {
      width: 0;
      height: 0;
      border-top: 7px solid transparent;
      border-bottom: 7px solid transparent;
      border-right: 9px solid #7fff00;
      margin-right: -1px;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
    }

    .annotation-box {
      background: #7fff00;
      color: #1a1a1a;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .axis {
      position: absolute;
      left: 175px;
      margin-left: 10px;
      top: 0;
      height: 100%;
      width: 2px;
      z-index: 3;
    }

    .axis-track {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #7fff00;
    }

    .axis-track::before,
    .axis-track::after {
      content: '';
      position: absolute;
      left: -4px;
      width: 10px;
      height: 2px;
      background: #7fff00;
    }

    .axis-track::before { top: 0; }
    .axis-track::after { bottom: 0; }

    .axis-label {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      text-align: center;
      color: rgba(255, 255, 255, 0.85);
      font-size: 11px;
      font-weight: 700;
    }

    .axis-label-top { top: 2px; }
    .axis-label-bottom { bottom: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">BB Returns</div>
    
    <div class="silhouette-stage">
      <div class="axis">
        <div class="axis-track"></div>
        <div class="axis-label axis-label-top">100</div>
        <div class="axis-label axis-label-bottom">0</div>
      </div>

      <div class="silhouette-wrapper">
        <div class="photo-full" id="photoFull"></div>
        <div class="outline-reveal" id="outlineReveal">
          <div class="outline-image" id="outlineImage"></div>
        </div>
      </div>

      <div class="annotation" id="annotation">
        <div class="annotation-arrow"></div>
        <div class="annotation-box"><span id="annotationPercent">0.00%</span></div>
      </div>
    </div>



    <div class="progress-info">
      <div id="daysLeft">--- days</div>
    </div>

    <div class="arrival-date">
      Arriving: <span id="arrivalDate">Sep 10, 7:00 PM MST</span>
    </div>

    <label style="display: flex; align-items: center; gap: 6px; color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 6px; cursor: pointer;">
      <input type="checkbox" id="earlyReturnCheckbox" style="width: 13px; height: 13px; cursor: pointer;">
      Early return (9/1 8:45 AM)
    </label>
    <a class="view-toggle-link" href="index.html" onclick="this.href='index.html?t='+Date.now()">← Back to Countdown</a>
    <div style="color: rgba(255,255,255,0.4); font-size: 11px; margin-top: 4px;">v2026-08-01-6</div>
  </div>

  <script>
    // Countdown configuration
    const departureTime = new Date('2026-06-03T08:50:00-07:00').getTime();

    // --- Arrival date/time step schedule (matches index.html) ---
    // The return date jumps instantly to a new fixed value at each
    // scheduled trigger time (4:10 PM MST each day), instead of sliding.
    const ARRIVAL_SCHEDULE = [
      { at: null,                                            value: new Date('2026-09-09T16:10:00-07:00').getTime() },
      { at: new Date('2026-07-30T16:10:00-07:00').getTime(), value: new Date('2026-09-08T16:10:00-07:00').getTime() },
      { at: new Date('2026-07-31T16:10:00-07:00').getTime(), value: new Date('2026-09-07T16:10:00-07:00').getTime() },
      { at: new Date('2026-07-30T00:00:00-07:00').getTime(), value: new Date('2026-09-06T16:10:00-07:00').getTime() },
      { at: new Date('2026-07-30T00:00:00-07:00').getTime(), value: new Date('2026-09-05T16:10:00-07:00').getTime() },
      { at: new Date('2026-07-30T00:00:00-07:00').getTime(), value: new Date('2026-09-04T16:10:00-07:00').getTime() },
      { at: new Date('2026-07-30T00:00:00-07:00').getTime(), value: new Date('2026-09-01T16:10:00-07:00').getTime() }
    ];

    const EARLY_RETURN_VALUE = new Date('2026-09-01T08:45:00-07:00').getTime();

    function getInterpolatedArrival() {
      if (localStorage.getItem('earlyReturn') === 'true') {
        return EARLY_RETURN_VALUE;
      }
      const now = new Date().getTime();
      let current = ARRIVAL_SCHEDULE[0].value;
      for (let i = 1; i < ARRIVAL_SCHEDULE.length; i++) {
        if (now >= ARRIVAL_SCHEDULE[i].at) {
          current = ARRIVAL_SCHEDULE[i].value;
        }
      }
      return current;
    }

    function updateProgress() {
      const now = new Date().getTime();
      const arrivalTime = getInterpolatedArrival();
      const totalTime = arrivalTime - departureTime;
      const elapsed = now - departureTime;
      const remaining = arrivalTime - now;
      
      // Calculate percentage completed (0-100)
      const percentCompleted = Math.max(0, Math.min(100, (elapsed / totalTime) * 100));
      
      // Update outline reveal height (grows from bottom up)
      const outlineReveal = document.getElementById('outlineReveal');
      outlineReveal.style.height = percentCompleted + '%';

      // Update annotation: sits at the top edge of the reveal, pointing at it
      const annotation = document.getElementById('annotation');
      annotation.style.top = (100 - percentCompleted) + '%';
      document.getElementById('annotationPercent').textContent = percentCompleted.toFixed(2) + '%';
      
      // Update days left
      const daysLeft = Math.round(remaining / (1000 * 60 * 60 * 24));
      document.getElementById('daysLeft').textContent = Math.max(0, daysLeft) + ' days left';
      
      // Update arrival date
      const arrivalDate = new Date(arrivalTime);
      const options = { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: 'America/Phoenix' };
      document.getElementById('arrivalDate').textContent = arrivalDate.toLocaleDateString('en-US', options) + ' MST';
    }

    // Initial update
    updateProgress();
    
    // Update every 100ms for smooth animation
    setInterval(updateProgress, 100);

    // Photo auto-rotation: cycles through all 4 photos every 2 seconds
    window.addEventListener('DOMContentLoaded', () => {
      // Each photo's actual pixel dimensions, used to compute a box that
      // exactly matches its aspect ratio - so "cover" never has to crop
      // anything, every photo is shown in full. Capped to a max width/height
      // so wider or taller photos can't overflow the screen.
      const PHOTO_OPTIONS = [
        {
          photo: 'https://raw.githubusercontent.com/billpollock1-hue/az-countdown-clock/main/Pool.jpg',
          outline: 'https://raw.githubusercontent.com/billpollock1-hue/az-countdown-clock/main/PoolOutline.png',
          ratio: 592 / 1364
        },
        {
          photo: 'https://raw.githubusercontent.com/billpollock1-hue/az-countdown-clock/main/Silhouette2.jpg',
          outline: 'https://raw.githubusercontent.com/billpollock1-hue/az-countdown-clock/main/Silhouette2Outline.png',
          ratio: 1348 / 1278
        },
        {
          photo: 'https://raw.githubusercontent.com/billpollock1-hue/az-countdown-clock/main/Silhouette3.jpg',
          outline: 'https://raw.githubusercontent.com/billpollock1-hue/az-countdown-clock/main/Silhouette3Outline.png',
          ratio: 768 / 1024
        },
        {
          photo: 'https://raw.githubusercontent.com/billpollock1-hue/az-countdown-clock/main/Silhouette4.jpg',
          outline: 'https://raw.githubusercontent.com/billpollock1-hue/az-countdown-clock/main/Silhouette4Outline.png',
          ratio: 1004 / 1142
        }
      ];

      const ROTATE_MS = 2000;
      const MAX_W = 220;
      const MAX_H = 380;
      const LEFT_BUFFER = 20;   // small left margin, balances against the annotation space on the right
      const RIGHT_RESERVED = 96; // room for axis + annotation

      const photoFull = document.getElementById('photoFull');
      const outlineImage = document.getElementById('outlineImage');
      const wrapper = document.querySelector('.silhouette-wrapper');
      const stage = document.querySelector('.silhouette-stage');
      const annotation = document.getElementById('annotation');
      const axis = document.querySelector('.axis');

      function fitDimensions(ratio) {
        // Try full height first; if that makes it too wide, constrain by width instead.
        let h = MAX_H;
        let w = h * ratio;
        if (w > MAX_W) {
          w = MAX_W;
          h = w / ratio;
        }
        return { w: Math.round(w), h: Math.round(h) };
      }

      function applySelection(index) {
        const opt = PHOTO_OPTIONS[index];
        if (!opt) return;
        photoFull.style.backgroundImage = `url('${opt.photo}')`;
        outlineImage.style.backgroundImage = `url('${opt.outline}')`;

        const { w, h } = fitDimensions(opt.ratio);
        wrapper.style.width = w + 'px';
        wrapper.style.height = h + 'px';
        outlineImage.style.width = w + 'px';
        outlineImage.style.height = h + 'px';
        stage.style.width = (w + LEFT_BUFFER + RIGHT_RESERVED) + 'px';
        annotation.style.left = (LEFT_BUFFER + w) + 'px';
        axis.style.left = (LEFT_BUFFER + w) + 'px';
      }

      let currentIndex = 0;
      applySelection(currentIndex);

      setInterval(() => {
        currentIndex = (currentIndex + 1) % PHOTO_OPTIONS.length;
        applySelection(currentIndex);
      }, ROTATE_MS);
    });


    // Toggle early return override
    window.addEventListener('DOMContentLoaded', () => {
      const earlyCheckbox = document.getElementById('earlyReturnCheckbox');
      if (!earlyCheckbox) return;

      earlyCheckbox.checked = localStorage.getItem('earlyReturn') === 'true';

      earlyCheckbox.addEventListener('change', () => {
        localStorage.setItem('earlyReturn', earlyCheckbox.checked);
      });
    });

    // Auto-reload every 5 minutes so any already-open tab can never run
    // stale JS for long after a deploy.
    setInterval(() => { window.location.reload(); }, 5 * 60 * 1000);
  </script>
</body>
</html>
